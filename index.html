<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nostr Permissionless Standards (NIP-PS): anyone can propose, adoption is the signal, trust is a lens you choose." />
    <title>Nostr Permissionless Standards (NIP-PS)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Theme: apply the saved choice before first paint (default dark). -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('nip-ps:theme');
          var theme = raw ? JSON.parse(raw).state.theme : 'dark';
          document.documentElement.classList.toggle('dark', theme !== 'light');
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
